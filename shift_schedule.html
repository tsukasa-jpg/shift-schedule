<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>月間シフト表</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --header-h: 44px; --legend-h: 0px; }

    body {
      font-family: 'Meiryo UI', 'Meiryo', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      font-size: 12px;
      background: #f0f2f5;
      color: #333;
    }

    /* ===== HEADER ===== */
    #app-header {
      background: #1e3a5f;
      color: #fff;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      flex-wrap: wrap;
    }
    #app-header h1 { font-size: 14px; font-weight: bold; white-space: nowrap; }

    .month-nav { display: flex; align-items: center; gap: 5px; }
    .month-nav button {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 4px 9px; border-radius: 4px;
      cursor: pointer; font-size: 12px; font-family: inherit;
    }
    .month-nav button:hover { background: rgba(255,255,255,0.28); }

    #currentMonthLabel {
      font-size: 14px; font-weight: bold;
      white-space: nowrap; min-width: 170px; text-align: center;
    }

    .header-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

    .hbtn {
      padding: 5px 11px; border-radius: 4px; border: none;
      cursor: pointer; font-size: 12px; font-family: inherit; white-space: nowrap;
    }
    .hbtn-green  { background: #48bb78; color: #fff; } .hbtn-green:hover  { background: #38a169; }
    .hbtn-orange { background: #ed8936; color: #fff; } .hbtn-orange:hover { background: #dd6b20; }
    .hbtn-teal   { background: #319795; color: #fff; } .hbtn-teal:hover   { background: #2c7a7b; }
    .hbtn-ghost  { background: rgba(255,255,255,0.13); color: #fff; border: 1px solid rgba(255,255,255,0.28); }
    .hbtn-ghost:hover { background: rgba(255,255,255,0.22); }

    /* ===== LEGEND ===== */
    #legend {
      padding: 5px 14px;
      background: #fff;
      border-bottom: 1px solid #dde1e7;
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .leg-label { font-size: 11px; font-weight: bold; color: #555; margin-right: 2px; }
    .leg-chip  { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; white-space: nowrap; }
    .leg-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-weight: bold; font-size: 11px; }
    .leg-time  { color: #888; }
    .leg-hint  { margin-left: auto; font-size: 10px; color: #aaa; white-space: nowrap; }
    .leg-divider { width: 1px; background: #ddd; height: 16px; margin: 0 2px; }

    /* ===== BIKO SECTION ===== */
    #biko-section {
      margin: 8px 14px 0;
      border: 1px solid #dde1e7;
      border-radius: 4px;
      padding: 6px 10px;
      background: #fff;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    #biko-section .biko-label { font-size: 12px; font-weight: bold; color: #555; white-space: nowrap; padding-top: 4px; }
    #biko-section textarea {
      flex: 1;
      resize: vertical;
      min-height: 48px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 4px 6px;
      color: #333;
      line-height: 1.5;
    }
    #biko-section .biko-print-text { display: none; }

    /* ===== TABLE CONTAINER ===== */
    #table-container {
      overflow: auto;
      height: calc(100vh - var(--header-h) - var(--legend-h));
      padding: 10px 12px 24px;
    }

    /* ===== SHIFT TABLE ===== */
    #shiftTable {
      border-collapse: collapse; background: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1); min-width: max-content;
    }
    #shiftTable th, #shiftTable td {
      border: 1px solid #c8cdd5; padding: 3px 4px;
      text-align: center; white-space: nowrap; height: 26px; font-size: 11px;
    }

    /* Sticky thead — relative to #table-container (the scroll container) */
    #shiftTable thead th { position: sticky; top: 0; z-index: 20; background: #2c4f78; color: #fff; }
    #shiftTable thead tr:nth-child(2) th { top: 26px; }
    #shiftTable thead tr:nth-child(3) th { top: 52px; }

    /* Sticky first col */
    .col-name {
      position: sticky; left: 0; z-index: 15;
      text-align: left; padding-left: 7px !important;
      min-width: 90px; max-width: 130px; font-weight: bold;
    }
    #shiftTable thead .col-name { background: #1e3a5f; z-index: 35; }
    #shiftTable tbody .col-name { background: #e9ecf1; }
    #shiftTable tfoot .col-name { background: #dde2ea; }

    /* Date headers */
    .dh-month { font-size: 10px; min-width: 34px; background: #3a5a80 !important; }
    .dh-num   { min-width: 34px; font-size: 11px; }
    .dh-dow   { font-size: 10px; min-width: 34px; }

    .d-sat { background: #bed8f5 !important; color: #1a4a80 !important; }
    .d-sun { background: #fad4d4 !important; color: #a01010 !important; }
    .d-hol { background: #fad4d4 !important; color: #a01010 !important; }

    .month-boundary { border-left: 3px solid #2c4f78 !important; }

    /* Shift cells */
    .shift-cell {
      cursor: pointer; min-width: 34px; user-select: none;
      transition: filter 0.08s; font-weight: bold; position: relative;
    }
    .shift-cell:hover { filter: brightness(0.86); }
    .shift-cell.d-sat { background-color: #fff !important; color: #1a4a80; font-weight: normal; }
    .shift-cell.d-sun, .shift-cell.d-hol { background-color: #fff !important; color: #801010; font-weight: normal; }

    .skill-warn { outline: 2px solid #e53e3e; outline-offset: -2px; }
    .skill-warn::after {
      content: '⚠'; font-size: 8px; position: absolute;
      top: 1px; right: 1px; color: #e53e3e; pointer-events: none;
    }

    /* 定休日セル（空白時：斜線ハッチ） */
    .cell-reg-off {
      background-image: repeating-linear-gradient(
        135deg, transparent, transparent 4px,
        rgba(130,130,150,0.13) 4px, rgba(130,130,150,0.13) 8px
      ) !important;
    }
    /* 希望休セル（空白時：薄黄） */
    .cell-req-off { background-color: #fffbdc !important; }
    .cell-req-off::before {
      content: '希'; font-size: 8px; color: #b8880a; font-weight: bold;
      position: absolute; top: 1px; left: 2px; pointer-events: none;
      line-height: 1;
    }

    /* Summary / work-skill cols */
    .col-sum { background: #f4f6fa; font-size: 10px; min-width: 26px; }
    .col-sum-total { font-weight: bold; color: #1e3a5f; }
    .col-sum-hours { font-weight: bold; color: #5c1888; min-width: 36px; }
    .col-sum-budget { font-weight: bold; color: #7a3500; min-width: 56px; white-space: nowrap; }
    body:not([data-editor]) .col-sum-budget { display: none !important; }
    .hours-over { background: #fff0f0 !important; color: #c00 !important; }

    /* Tfoot */
    #shiftTable tfoot th { background: #3d5472; color: #fff; font-size: 10px; }
    #shiftTable tfoot td { background: #f4f6fa; font-size: 10px; }
    .tfoot-work-count { font-weight: bold; }

    /* Work skill coverage cells in tfoot */
    .ws-ok   { background: #c6f6d5 !important; color: #22543d !important; font-weight: bold; }
    .ws-ng   { background: #fed7d7 !important; color: #742a2a !important; font-weight: bold; }
    .ws-zero { background: #f4f6fa !important; color: #aaa !important; }

    /* Work skill coverage summary badge (header) */
    .ws-cov-badge {
      display: none; font-size: 11px; font-weight: bold; padding: 4px 10px;
      border-radius: 12px; cursor: pointer; white-space: nowrap;
    }
    .ws-cov-badge.cov-ok { display: inline-block; background: #c6f6d5; color: #22543d; }
    .ws-cov-badge.cov-ng { display: inline-block; background: #fed7d7; color: #742a2a; }

    /* Work skill badges in staff name cell */
    .ws-badge {
      display: inline-block; font-size: 9px; padding: 0 3px;
      border-radius: 2px; margin-left: 2px; line-height: 14px;
      font-weight: bold; vertical-align: middle;
    }

    /* ===== POPUP ===== */
    #shiftPopup {
      position: fixed; display: none; background: #fff;
      border: 1px solid #b0b8c4; border-radius: 10px;
      padding: 11px 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.22);
      z-index: 1000; min-width: 235px;
    }
    .popup-title {
      font-size: 11px; font-weight: bold; color: #3a4a5c;
      padding-bottom: 7px; margin-bottom: 5px; border-bottom: 1px solid #e4e8ee;
    }
    .popup-info-row { font-size: 10px; margin-bottom: 6px; color: #555; }
    .popup-info-row span { margin-right: 6px; }
    .popup-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 5px; }
    .popup-shift-btn {
      border: 1px solid rgba(0,0,0,0.12); border-radius: 5px; cursor: pointer;
      padding: 6px 3px 5px; font-family: inherit; font-weight: bold;
      font-size: 12px; text-align: center; line-height: 1.2; transition: filter 0.08s;
    }
    .popup-shift-btn:hover { filter: brightness(0.87); }
    .popup-shift-btn small { display: block; font-size: 9px; font-weight: normal; margin-top: 1px; }
    .popup-shift-btn.no-skill { opacity: 0.42; }
    .popup-clear-btn {
      background: #fff; color: #888; border: 1px dashed #b0b8c4;
      border-radius: 5px; cursor: pointer; padding: 6px 3px;
      font-family: inherit; font-size: 11px;
    }
    .popup-clear-btn:hover { background: #f4f6fa; }
    .popup-cancel-btn {
      background: #e8eaf0; color: #555; border: 1px solid #c8cdd5;
      border-radius: 5px; cursor: pointer; padding: 6px 3px;
      font-family: inherit; font-size: 11px;
    }
    .popup-cancel-btn:hover { background: #dde1e7; }

    /* ===== MODALS (shared overlay style) ===== */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.48); z-index: 500;
      align-items: center; justify-content: center;
    }
    .modal-box {
      background: #fff; border-radius: 10px; padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex; flex-direction: column; gap: 12px;
      max-height: 88vh; overflow: hidden;
    }
    .modal-box h2 { font-size: 16px; color: #1e3a5f; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }

    .dbtn { padding: 7px 12px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; font-family: inherit; }
    .dbtn-green  { background: #48bb78; color: #fff; } .dbtn-green:hover  { background: #38a169; }
    .dbtn-gray   { background: #718096; color: #fff; } .dbtn-gray:hover   { background: #4a5568; }
    .dbtn-blue   { background: #4299e1; color: #fff; } .dbtn-blue:hover   { background: #3182ce; }
    .dbtn-orange { background: #ed8936; color: #fff; } .dbtn-orange:hover { background: #dd6b20; }

    /* ===== STAFF TYPE BADGE ===== */
    .staff-type-badge {
      display: inline-block; font-size: 9px; padding: 0 3px;
      border-radius: 2px; margin-right: 3px; line-height: 14px;
      background: #1e3a5f; color: #fff; font-weight: bold; vertical-align: middle;
    }
    .staff-type-sel {
      font-size: 11px; padding: 2px 4px; border: 1px solid #c8cdd5;
      border-radius: 4px; font-family: inherit; color: #333; background: #f4f6fa; cursor: pointer;
    }
    #newStaffType {
      padding: 7px 6px; border: 1px solid #c0c8d4; border-radius: 5px;
      font-size: 12px; font-family: inherit; outline: none; background: #fff; cursor: pointer;
    }

    /* ===== STAFF DIALOG ===== */
    #staffDialog { width: 520px; }
    .add-row { display: flex; gap: 8px; flex-shrink: 0; }
    #newStaffInput {
      flex: 1; padding: 7px 9px; border: 1px solid #c0c8d4;
      border-radius: 5px; font-size: 13px; font-family: inherit; outline: none;
    }
    #newStaffInput:focus { border-color: #4a90d9; box-shadow: 0 0 0 3px rgba(74,144,217,0.15); }

    #staffListEl { overflow-y: auto; flex: 1; border: 1px solid #dde1e7; border-radius: 6px; max-height: 440px; }

    .staff-item { border-bottom: 1px solid #f0f2f5; }
    .staff-item:last-child { border-bottom: none; }
    .staff-item-header {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 9px; cursor: default;
    }
    .staff-item-header:hover { background: #f7f9fc; }
    .si-index { font-size: 10px; color: #aaa; min-width: 18px; }
    .si-name  { flex: 1; font-size: 13px; font-weight: bold; }
    .si-btn {
      background: none; border: 1px solid #c0c8d4; border-radius: 3px;
      cursor: pointer; padding: 2px 6px; font-size: 11px; color: #555;
    }
    .si-btn:hover { background: #f0f2f5; }
    .si-btn:disabled { opacity: 0.3; cursor: default; }
    .si-del { color: #c53030; border-color: #fed7d7; }
    .si-del:hover { background: #fff5f5; }
    .si-skill-toggle {
      font-size: 10px; background: #e8f0fb; border: 1px solid #b8ccee;
      border-radius: 3px; padding: 2px 6px; cursor: pointer; color: #2c5282;
    }
    .si-skill-toggle:hover { background: #d0e3f8; }

    /* Skill panel */
    .skill-panel { padding: 8px 12px 10px 36px; background: #f8fafc; border-top: 1px solid #edf0f5; display: none; }
    .skill-panel.open { display: block; }
    .skill-section-title { font-size: 11px; font-weight: bold; color: #2c5282; margin: 8px 0 5px; }
    .skill-section-title:first-child { margin-top: 0; }
    .skill-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .skill-chip {
      padding: 3px 8px; border-radius: 4px; border: 2px solid transparent;
      cursor: pointer; font-size: 11px; font-weight: bold;
      opacity: 0.35; transition: opacity 0.15s, border-color 0.15s;
    }
    .skill-chip.active { opacity: 1; border-color: rgba(0,0,0,0.25); }
    .skill-sat-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #555; margin-top: 4px; }
    .skill-sat-row input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; }

    /* 定休日 曜日チップ */
    .dow-chip {
      display: inline-block; width: 28px; height: 24px; line-height: 24px;
      text-align: center; border-radius: 4px; border: 2px solid transparent;
      cursor: pointer; font-size: 12px; font-weight: bold;
      background: #edf2f7; color: #718096;
      opacity: 0.45; transition: opacity 0.15s, border-color 0.15s;
    }
    .dow-chip.active       { opacity: 1; border-color: #718096; background: #e2e8f0; color: #2d3748; }
    .dow-chip.active.sat   { background: #bee3f8; border-color: #3182ce; color: #1a4a80; }
    .dow-chip.active.sun   { background: #fed7d7; border-color: #e53e3e; color: #9b2c2c; }

    /* 希望休 */
    .req-off-section { margin-top: 2px; }
    .skill-wage-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
    .wage-input { width: 80px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .req-off-add-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .req-off-date-input {
      padding: 4px 6px; border: 1px solid #c0c8d4; border-radius: 4px;
      font-size: 12px; font-family: inherit; outline: none; color: #333;
    }
    .req-off-date-input:focus { border-color: #4a90d9; }
    .req-off-add-btn {
      padding: 4px 10px; background: #4299e1; color: #fff; border: none;
      border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit;
    }
    .req-off-add-btn:hover { background: #3182ce; }
    .req-off-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .req-off-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: #fffbdc; border: 1px solid #d4a000; border-radius: 12px;
      padding: 2px 8px 2px 10px; font-size: 11px; color: #7a5c00;
    }
    .req-off-remove {
      background: none; border: none; cursor: pointer;
      color: #b8880a; font-size: 13px; line-height: 1; padding: 0;
    }
    .req-off-remove:hover { color: #c53030; }

    /* ===== 要望・制約 ===== */
    .consec-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 12px; color: #333; }
    .consec-input { width: 52px; padding: 3px 6px; border: 1px solid #c0c8d4; border-radius: 4px; font-size: 12px; font-family: inherit; text-align: center; }
    .dc-add-row { display: flex; gap: 5px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .dc-type-sel {
      padding: 4px 5px; border: 1px solid #c0c8d4; border-radius: 4px;
      font-size: 11px; font-family: inherit; color: #333; background: #f7f9fc;
    }
    .dc-hour-input { width: 46px; padding: 4px 6px; border: 1px solid #c0c8d4; border-radius: 4px; font-size: 12px; font-family: inherit; text-align: center; }
    .dc-memo-input { flex: 1; min-width: 80px; padding: 4px 6px; border: 1px solid #c0c8d4; border-radius: 4px; font-size: 12px; font-family: inherit; }
    .dc-add-btn { padding: 4px 10px; background: #805ad5; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; white-space: nowrap; }
    .dc-add-btn:hover { background: #6b46c1; }
    .dc-list { display: flex; flex-direction: column; gap: 4px; }
    .dc-tag {
      display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap;
      background: #faf5ff; border: 1px solid #d6bcfa; border-radius: 6px;
      padding: 3px 8px; font-size: 11px; color: #553c9a;
    }
    .dc-tag.type-end    { background: #fff5f5; border-color: #feb2b2; color: #9b2c2c; }
    .dc-tag.type-start  { background: #f0fff4; border-color: #9ae6b4; color: #276749; }
    .dc-tag.type-consec { background: #fffaf0; border-color: #fbd38d; color: #744210; }
    .dc-remove { background: none; border: none; cursor: pointer; color: #888; font-size: 13px; line-height: 1; padding: 0; margin-left: 2px; }
    .dc-remove:hover { color: #c53030; }

    /* ===== REQUIREMENTS DIALOG ===== */
    #reqDialog { width: 540px; }
    .req-table-wrap { overflow-x: auto; flex: 1; }
    .req-table { border-collapse: collapse; width: 100%; }
    .req-table th, .req-table td { border: 1px solid #dde1e7; padding: 6px 8px; text-align: center; font-size: 12px; }
    .req-table th { background: #2c4f78; color: #fff; font-weight: bold; }
    .req-table td:first-child { text-align: left; font-weight: bold; white-space: nowrap; }
    .req-input {
      width: 46px; padding: 4px 5px; border: 1px solid #c0c8d4;
      border-radius: 4px; text-align: center; font-size: 12px;
      font-family: inherit; outline: none;
    }
    .req-input:focus { border-color: #4a90d9; }
    .req-note { font-size: 11px; color: #888; }

    /* ===== AUTO-CREATE DIALOG ===== */
    #autoDialog { width: 380px; }
    .auto-option { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .auto-option input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }
    .auto-note { font-size: 11px; color: #888; line-height: 1.6; }

    /* ===== PAID LEAVE DIALOG ===== */
    #paidLeaveDialog { width: 700px; max-width: 96vw; }
    .pl-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
    .pl-year-sel {
      padding: 5px 8px; border: 1px solid #c0c8d4; border-radius: 5px;
      font-size: 13px; font-family: inherit; outline: none; background: #fff; cursor: pointer;
    }
    .pl-note { font-size: 11px; color: #888; }
    .pl-table-wrap { overflow: auto; flex: 1; max-height: 420px; }
    .pl-table { border-collapse: collapse; width: 100%; min-width: 560px; }
    .pl-table th, .pl-table td {
      border: 1px solid #dde1e7; padding: 6px 9px; text-align: center; font-size: 12px; white-space: nowrap;
    }
    .pl-table th { background: #2c4f78; color: #fff; font-weight: bold; position: sticky; top: 0; z-index: 2; }
    .pl-table td:first-child { text-align: left; font-weight: bold; background: #f4f6fa; }
    .pl-input {
      width: 56px; padding: 4px 6px; border: 1px solid #c0c8d4;
      border-radius: 4px; text-align: center; font-size: 12px;
      font-family: inherit; outline: none;
    }
    .pl-input:focus { border-color: #4a90d9; }
    .pl-used   { color: #6b21a8; font-weight: bold; }
    .pl-remain { font-weight: bold; }
    .pl-remain.over { color: #c00; }
    .pl-remain.ok   { color: #276749; }
    .pl-holiday-count { color: #555; }
    .pl-tfoot td { background: #3d5472; color: #fff; font-weight: bold; text-align: center; }
    .pl-tfoot td:first-child { text-align: left; }
    .pl-summary { display: flex; gap: 16px; flex-shrink: 0; flex-wrap: wrap; }

/* =====================================================

===================================================== */
function loadData() {
  try {
    const d = JSON.parse(localStorage.getItem('shiftAppV4') || '{}');
    staffList     = Array.isArray(d.staffList)                               ? d.staffList     : defaultStaff();
    shiftData     = typeof d.shiftData      === 'object' && d.shiftData     ? d.shiftData     : {};
    staffSkills   = typeof d.staffSkills    === 'object' && d.staffSkills   ? d.staffSkills   : {};
    workSkillReqs = typeof d.workSkillReqs  === 'object' && d.workSkillReqs ? d.workSkillReqs : defaultReqs();
    bikoNotes     = typeof d.bikoNotes      === 'object' && d.bikoNotes     ? d.bikoNotes     : {};
    paidLeaveData = typeof d.paidLeaveData  === 'object' && d.paidLeaveData ? d.paidLeaveData : {};
    // 旧「配送」コードを「配送①」へ移行
    Object.values(shiftData).forEach(pd => {
      Object.values(pd).forEach(nd => {
        Object.keys(nd).forEach(dk => { if (nd[dk] === '配送') nd[dk] = '配送①'; });
      });
    });
    Object.values(staffSkills).forEach(sk => {
      if (sk.shifts) sk.shifts = sk.shifts.map(c => c === '配送' ? '配送①' : c);
    });
  } catch {
    staffList = defaultStaff();
    shiftData = {}; staffSkills = {};
    workSkillReqs = defaultReqs();
  }
}
function _saveLocal() {
  const updatedAt = new Date().toISOString();
  localStorage.setItem('shiftAppV4', JSON.stringify({ staffList, shiftData, staffSkills, workSkillReqs, bikoNotes, paidLeaveData, updatedAt }));
}
function _localUpdatedAt() {
  try { return new Date(JSON.parse(localStorage.getItem('shiftAppV4') || '{}').updatedAt || 0).getTime(); }
  catch { return 0; }
}
function saveData() {
  _saveLocal();
  saveDataToSupabase(); // 非同期・失敗してもlocalStorageは影響なし
}

/* =====================================================
   SUPABASE SYNC
===================================================== */
function setSyncStatus(state) {
  if (!_supabase) return;
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = {
    syncing: { text: '同期中…',    color: '#aaa' },
    ok:      { text: '✓ 同期済み', color: '#4caf50' },
    error:   { text: '✗ 同期エラー', color: '#f44336' },
  };
  const s = map[state] || {};
  el.textContent = s.text ?? '';
  el.style.color  = s.color ?? '';
}

async function saveDataToSupabase() {
  if (!_supabase) return;
  try {
    const { error } = await _supabase
      .from('shift_app_data')
      .upsert({ id: 'main', data: { staffList, shiftData, staffSkills, workSkillReqs, bikoNotes, paidLeaveData }, updated_at: new Date().toISOString() });
    if (error) throw error;
    setSyncStatus('ok');
  } catch (e) {
    console.error('[Supabase] save error:', e);
    setSyncStatus('error');
  }
}

async function loadDataFromSupabase() {
  if (!_supabase) return false;
  setSyncStatus('syncing');
  try {
    const { data: row, error } = await _supabase
      .from('shift_app_data')
      .select('data, updated_at')
      .eq('id', 'main')
      .single();
    if (error) throw error;

    const remoteTime = row?.updated_at ? new Date(row.updated_at).getTime() : 0;
    const localTime  = _localUpdatedAt();

    // ローカルの方が新しい（または同じ）→ Supabaseへ押し出す
    if (!row?.data || localTime >= remoteTime) {
      console.log('[Supabase] ローカルが新しいためSupabaseへ保存 local=', new Date(localTime).toISOString(), 'remote=', row?.updated_at);
      await saveDataToSupabase();
      setSyncStatus('ok');
      return false;
    }

    // Supabaseの方が新しい → ローカルを上書き
    console.log('[Supabase] Supabaseが新しいため取得 remote=', row.updated_at, 'local=', new Date(localTime).toISOString());
    const d = row.data;
    if (Array.isArray(d.staffList))                                        staffList     = d.staffList;
    if (typeof d.shiftData     === 'object' && d.shiftData)                shiftData     = d.shiftData;
    if (typeof d.staffSkills   === 'object' && d.staffSkills)              staffSkills   = d.staffSkills;
    if (typeof d.workSkillReqs === 'object' && d.workSkillReqs)            workSkillReqs = d.workSkillReqs;
    if (typeof d.bikoNotes     === 'object' && d.bikoNotes)                bikoNotes     = d.bikoNotes;
    if (typeof d.paidLeaveData === 'object' && d.paidLeaveData)            paidLeaveData = d.paidLeaveData;
    // 旧データ移行を再適用
    Object.values(shiftData).forEach(pd =>
      Object.values(pd).forEach(nd =>
        Object.keys(nd).forEach(dk => { if (nd[dk] === '配送') nd[dk] = '配送①'; })));
    Object.values(staffSkills).forEach(sk => {
      if (sk.shifts) sk.shifts = sk.shifts.map(c => c === '配送' ? '配送①' : c);
    });
    _saveLocal();
    renderTable();
    setSyncStatus('ok');
    return true;
  } catch (e) {
    console.error('[Supabase] load error:', e);
    setSyncStatus('error');
    return false;
  }
}

/* =====================================================
   HELPERS
===================================================== */
function pad2(n) { return String(n).padStart(2,'0'); }
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function periodKey() { return `${currentYear}-${pad2(currentMonth)}-16`; }
function dateStr(y, m, d) { return `${y}-${pad2(m)}-${pad2(d)}`; }
function dayOfWeek(y, m, d) { return new Date(y, m-1, d).getDay(); }
function isHoliday(y, m, d) { return dateStr(y,m,d) in HOLIDAYS; }
function isCompanyHoliday(y, m, d) { return COMPANY_HOLIDAYS.has(dateStr(y,m,d)); }

function dayClass(y, m, d) {
  const dow = dayOfWeek(y, m, d);
  if (isHoliday(y, m, d)) return 'd-hol';
  if (dow === 0) return 'd-sun';
  if (dow === 6) return 'd-sat';
  return '';
}

function getPeriodDays() {
  const y1 = currentYear, m1 = currentMonth;
  let y2 = y1, m2 = m1 + 1;
  if (m2 > 12) { m2 = 1; y2++; }
  const days = [];
  for (let d = 16; d <= daysInMonth(y1, m1); d++) days.push({ y: y1, m: m1, d });
  for (let d = 1;  d <= 15;                  d++) days.push({ y: y2, m: m2, d });
  return days;
}

function getShift(staff, dayObj) {
  const pk = periodKey();
  const dk = dateStr(dayObj.y, dayObj.m, dayObj.d);
  return shiftData[pk]?.[staff]?.[dk] ?? '';
}
function setShift(staff, dayObj, code) {
  const pk = periodKey(), dk = dateStr(dayObj.y, dayObj.m, dayObj.d);
  if (!shiftData[pk])        shiftData[pk] = {};
  if (!shiftData[pk][staff]) shiftData[pk][staff] = {};
  if (code === '') delete shiftData[pk][staff][dk];
  else             shiftData[pk][staff][dk] = code;
  saveData();
}

function getShiftSkills(name)      { return staffSkills[name]?.shifts        ?? []; }
function getWorkSkills(name)       { return staffSkills[name]?.workSkills     ?? []; }
function getWorkSat(name)          { return staffSkills[name]?.workSat        ?? false; }
function getWorkSun(name)          { return staffSkills[name]?.workSun        ?? false; }
function getRegularDaysOff(name)   { return staffSkills[name]?.regularDaysOff ?? []; }   // array of DOW (0-6)
function getRequestedDaysOff(name) { return staffSkills[name]?.requestedDaysOff ?? []; } // array of 'YYYY-MM-DD'
function getStaffType(name)        { return staffSkills[name]?.type           ?? 'パート'; } // 'パート' | '社員'
function hasShiftSkill(name, code) { return getShiftSkills(name).includes(code); }

function isRegularDayOff(name, y, m, d) {
  return getRegularDaysOff(name).includes(dayOfWeek(y, m, d));
}
function isRequestedDayOff(name, y, m, d) {
  return getRequestedDaysOff(name).includes(dateStr(y, m, d));
}
function getBirthMonth(name) { return staffSkills[name]?.birthMonth || 0; }
function getBirthDay(name)   { return staffSkills[name]?.birthDay   || 0; }
function isBirthday(name, y, m, d) {
  return getBirthMonth(name) === m && getBirthDay(name) === d;
}

function getWsReq(ws, dow) { return workSkillReqs[ws]?.[dow] ?? 0; }

function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function getPeriodLabel() {
  const y1 = currentYear, m1 = currentMonth;
  let y2 = y1, m2 = m1 + 1;
  if (m2 > 12) { m2 = 1; y2++; }
  return y1 === y2
    ? `${y1}年${m1}月16日〜${m2}月15日`
    : `${y1}年${m1}月16日〜${y2}年${m2}月15日`;
}

/* =====================================================
   TABLE RENDER
===================================================== */
function renderTable() {
  document.getElementById('currentMonthLabel').textContent = getPeriodLabel();

  const periodDays = getPeriodDays();
  const pk   = periodKey();
  const mdata = shiftData[pk] || {};

  /* --- per-day totals --- */
  const workCount  = {};
  const shiftCount = {};
  const wsCount    = {}; // { dk: { wsName: count } }

  periodDays.forEach(day => {
    const dk = dateStr(day.y, day.m, day.d);
    workCount[dk]  = 0;
    shiftCount[dk] = {};
    wsCount[dk]    = {};
    WORK_SKILLS.forEach(ws => { wsCount[dk][ws] = 0; });
  });

  staffList.forEach(name => {
    const sdata    = mdata[name] || {};
    const wsSkills = getWorkSkills(name);
    periodDays.forEach(day => {
      const dk = dateStr(day.y, day.m, day.d);
      const c  = sdata[dk] || '';
      if (c && c !== '休') {
        workCount[dk]++;
        // count work skill coverage for working days
        wsSkills.forEach(ws => { wsCount[dk][ws]++; });
      }
      if (c) shiftCount[dk][c] = (shiftCount[dk][c] || 0) + 1;
    });
  });

  /* --- per-staff totals --- */
  const staffWork = staffList.map(name => {
    const sdata = mdata[name] || {};
    let workDays = 0, totalHours = 0;
    const counts = {};
    SHIFTS.forEach(s => { counts[s.code] = 0; });
    periodDays.forEach(day => {
      const dk = dateStr(day.y, day.m, day.d);
      const c  = sdata[dk] || '';
      if (c && c !== '休') workDays++;
      if (c) {
        counts[c] = (counts[c] || 0) + 1;
        totalHours += getPaidH(SHIFT_MAP[c]?.h ?? 0);
      }
    });
    return { workDays, totalHours, counts };
  });

  /* --- build span data for month-label row --- */
  const spanData = [];
  let prevM = null, spanStart = 0;
  periodDays.forEach((day, i) => {
    if (day.m !== prevM) {
      if (prevM !== null) spanData.push({ y: periodDays[spanStart].y, m: prevM, count: i - spanStart, start: spanStart, boundary: spanStart > 0 });
      spanStart = i;
      prevM = day.m;
    }
    if (i === periodDays.length - 1) {
      spanData.push({ y: day.y, m: day.m, count: periodDays.length - spanStart, start: spanStart, boundary: spanStart > 0 });
    }
  });

  /* --- summary col headers --- */
  const sumHdr   = SKILL_SHIFTS.map(s =>
    `<th class="col-sum" style="background:${s.bg};color:${s.fg};" title="${esc(s.label)}">${esc(s.code)}</th>`
  ).join('') + `<th class="col-sum col-sum-hours" title="月間総労働時間">時間</th><th class="col-sum col-sum-budget" title="月間人件費">予算</th>`;
  const sumEmpty = SKILL_SHIFTS.map(() => `<th class="col-sum"></th>`).join('') + `<th class="col-sum"></th><th class="col-sum"></th>`;

  /* ---- THEAD ---- */
  let html = '<thead>';

  // Month labels row
  html += '<tr>';
  html += `<th class="col-name dh-month" rowspan="3">氏名</th>`;
  spanData.forEach(s => {
    html += `<th class="dh-month dh-month-th${s.boundary ? ' month-boundary' : ''}" colspan="${s.count}" data-mh-start="${s.start}" data-mh-count="${s.count}">${s.y}年${s.m}月</th>`;
  });
  html += `<th class="col-sum dh-month col-sum-total">計</th>${sumEmpty}</tr>`;

  // Day numbers row
  html += '<tr>';
  periodDays.forEach((day, i) => {
    const dc  = dayClass(day.y, day.m, day.d);
    const hol = isHoliday(day.y, day.m, day.d) ? HOLIDAYS[dateStr(day.y, day.m, day.d)] : '';
    const bnd = i > 0 && day.d === 1 ? ' month-boundary' : '';
    html += `<th class="dh-num ${dc}${bnd}" data-col="${i}"${hol ? ` title="${esc(hol)}"` : ''}>${day.d}</th>`;
  });
  html += `<th class="col-sum col-sum-total">日数</th>${sumEmpty}</tr>`;

  // Day of week row
  html += '<tr>';
  periodDays.forEach((day, i) => {
    const dc  = dayClass(day.y, day.m, day.d);
    const dow = dayOfWeek(day.y, day.m, day.d);
    const bnd = i > 0 && day.d === 1 ? ' month-boundary' : '';
    html += `<th class="dh-dow ${dc}${bnd}" data-col="${i}">${DOW_JA[dow]}</th>`;
  });
  html += `<th class="col-sum"></th>${sumEmpty}</tr>`;
  html += '</thead>';

  /* ---- TBODY ---- */
  html += '<tbody>';
  staffList.forEach((name, idx) => {
    const sdata      = mdata[name] || {};
    const sw         = staffWork[idx];
    const shiftSkls  = getShiftSkills(name);
    const wsSkls     = getWorkSkills(name);
    const rowBg      = idx % 2 === 0 ? '' : ' style="background:#fafbfd;"';

    const isEmployee = getStaffType(name) === '社員';
    html += `<tr${rowBg}>`;
    html += `<td class="col-name">${esc(name)}</td>`;

    periodDays.forEach((day, i) => {
      const dk    = dateStr(day.y, day.m, day.d);
      const code  = sdata[dk] || '';
      const shift = code ? SHIFT_MAP[code] : null;
      const dc    = dayClass(day.y, day.m, day.d);
      const bnd   = i > 0 && day.d === 1 ? ' month-boundary' : '';

      const mismatch = code && code !== '休' && code !== '有給' && shiftSkls.length > 0 && !shiftSkls.includes(code);
      const warnCls  = mismatch ? ' skill-warn' : '';
      const cellStyle = shift ? `background:${shift.bg};color:${shift.fg};` : '';
      const cellDcCls = shift ? '' : dc;

      // 定休日・希望休インジケーター（セルが空のときのみ）
      let offCls = '';
      if (!code) {
        if (isRegularDayOff(name, day.y, day.m, day.d))   offCls = ' cell-reg-off';
        else if (isRequestedDayOff(name, day.y, day.m, day.d)) offCls = ' cell-req-off';
      }

      // tooltip
      const regOff = isRegularDayOff(name, day.y, day.m, day.d);
      const reqOff = isRequestedDayOff(name, day.y, day.m, day.d);
      const tipParts = [];
      if (regOff) tipParts.push('定休日');
      if (reqOff) tipParts.push('希望休');
      const tipAttr = tipParts.length ? ` title="${tipParts.join(' / ')}"` : '';

      const restCls = code === '休' ? ' shift-rest' : '';
      const cellContent = code === '休' ? '' : code === '誕' ? '<span class="tan-screen">🎂</span><span class="tan-print">誕</span>' : (code.startsWith('配送') ? `<span class="haiso-pfx">配送</span>${esc(code.slice(2))}` : esc(code));
      html += `<td class="shift-cell${restCls} ${cellDcCls}${warnCls}${offCls}${bnd}"` +
              ` data-si="${idx}" data-di="${i}"` +
              ` style="${cellStyle}"${tipAttr}>${cellContent}</td>`;
    });

    html += `<td class="col-sum col-sum-total">${sw.workDays || ''}</td>`;
    SKILL_SHIFTS.forEach(s => {
      const n = sw.counts[s.code] || 0;
      html += `<td class="col-sum" style="${n > 0 ? `background:${s.bg};color:${s.fg};` : ''}">${n > 0 ? n : ''}</td>`;
    });
    // 時間列（実労働時間：休憩控除済み）
    const hDisp = sw.totalHours > 0 ? (sw.totalHours % 1 === 0 ? sw.totalHours : sw.totalHours.toFixed(1)) : '';
    const hOver = sw.totalHours > 171;
    const hTip  = hOver ? `月171時間超過 (実労働${sw.totalHours.toFixed(1)}h)` : `実労働時間 ${sw.totalHours.toFixed(1)}h (休憩控除済み)`;
    html += `<td class="col-sum col-sum-hours${hOver ? ' hours-over' : ''}" title="${hTip}">${hDisp}</td>`;
    // 予算列
    const wage = staffSkills[name]?.hourlyWage ?? 0;
    const budget = wage > 0 ? Math.round(sw.totalHours * wage) : 0;
    html += `<td class="col-sum col-sum-budget">${budget > 0 ? budget.toLocaleString() + '円' : ''}</td>`;
    html += '</tr>';
  });
  html += '</tbody>';

  /* --- grand totals for tfoot --- */
  const grandTotalHours  = staffWork.reduce((s, sw) => s + sw.totalHours, 0);
  const grandTotalBudget = staffList.reduce((s, name, idx) => {
    const w = staffSkills[name]?.hourlyWage ?? 0;
    return s + (w > 0 ? Math.round(staffWork[idx].totalHours * w) : 0);
  }, 0);
  const footExtra = () => `<td class="col-sum"></td><td class="col-sum"></td>`;

  /* ---- TFOOT ---- */
  html += '<tfoot>';

  // 勤務計
  html += '<tr>';
  html += `<th class="col-name">勤務計</th>`;
  periodDays.forEach((day, i) => {
    const dk  = dateStr(day.y, day.m, day.d);
    const n   = workCount[dk];
    const dc  = dayClass(day.y, day.m, day.d);
    const bnd = i > 0 && day.d === 1 ? ' month-boundary' : '';
    html += `<td class="${dc}${bnd} tfoot-work-count" data-col="${i}">${n > 0 ? n : ''}</td>`;
  });
  const gHDisp = grandTotalHours > 0 ? (grandTotalHours % 1 === 0 ? grandTotalHours : grandTotalHours.toFixed(1)) : '';
  html += `<td class="col-sum"></td>${SKILL_SHIFTS.map(() => '<td class="col-sum"></td>').join('')}<td class="col-sum col-sum-hours" style="font-weight:bold;">${gHDisp}</td><td class="col-sum col-sum-budget" style="font-weight:bold;">${grandTotalBudget > 0 ? grandTotalBudget.toLocaleString() + '円' : ''}</td></tr>`;

  // Per-shift counts
  SHIFTS.forEach(s => {
    html += '<tr>';
    html += `<th class="col-name" style="background:${s.bg};color:${s.fg};">${esc(s.code)}</th>`;
    periodDays.forEach((day, i) => {
      const dk  = dateStr(day.y, day.m, day.d);
      const n   = shiftCount[dk][s.code] || 0;
      const bnd = i > 0 && day.d === 1 ? ' month-boundary' : '';
      html += `<td class="${bnd}" data-col="${i}" style="${n > 0 ? `background:${s.bg};color:${s.fg};font-weight:bold;` : ''}">${n > 0 ? n : ''}</td>`;
    });
    html += `<td class="col-sum"></td>${SKILL_SHIFTS.map(() => '<td class="col-sum"></td>').join('')}${footExtra()}</tr>`;
  });

  // ---- Work skill coverage rows ----
  // 充足状況を集計（ヘッダーバッジ用）
  let wsReqCells = 0, wsShortfallCells = 0;
  periodDays.forEach(day => {
    const dk  = dateStr(day.y, day.m, day.d);
    const dow = dayOfWeek(day.y, day.m, day.d);
    WORK_SKILLS.forEach(ws => {
      const req = getWsReq(ws, dow);
      if (req > 0) {
        wsReqCells++;
        if ((wsCount[dk][ws] || 0) < req) wsShortfallCells++;
      }
    });
  });
  const covBadge = document.getElementById('wsCoverageBadge');
  if (covBadge) {
    if (wsReqCells === 0) {
      covBadge.className = 'ws-cov-badge';
      covBadge.textContent = '';
      covBadge.onclick = null;
    } else {
      covBadge.className = 'ws-cov-badge ' + (wsShortfallCells > 0 ? 'cov-ng' : 'cov-ok');
      covBadge.textContent = wsShortfallCells > 0 ? `⚠ 作業要件 ${wsShortfallCells}件未達` : '✓ 作業要件 充足';
      covBadge.onclick = () => document.getElementById('wsCoverageTitleRow')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  // Separator row
  html += `<tr id="wsCoverageTitleRow"><th class="col-name" colspan="${periodDays.length + 1 + SKILL_SHIFTS.length + 2}" style="background:#1e3a5f;color:#fff;font-size:10px;text-align:left;padding-left:8px;">▼ 作業スキルカバレッジ（実績 / 必要）</th></tr>`;

  WORK_SKILLS.forEach(ws => {
    const st = WS_STYLE[ws];
    html += '<tr>';
    html += `<th class="col-name" style="background:${st.bg};color:${st.fg};">${esc(ws)}</th>`;
    periodDays.forEach((day, i) => {
      const dk   = dateStr(day.y, day.m, day.d);
      const dow  = dayOfWeek(day.y, day.m, day.d);
      const req  = getWsReq(ws, dow);
      const act  = wsCount[dk][ws] || 0;
      const bnd  = i > 0 && day.d === 1 ? ' month-boundary' : '';
      let cls = 'ws-zero', txt = act > 0 ? String(act) : '';

      if (req > 0) {
        cls = act >= req ? 'ws-ok' : 'ws-ng';
        txt = act >= req ? String(act) : `${act}/${req}`;
      }
      html += `<td class="${cls}${bnd}" data-col="${i}" title="${esc(ws)}: 実${act} 要${req}">${txt}</td>`;
    });
    html += `<td class="col-sum"></td>${SKILL_SHIFTS.map(() => '<td class="col-sum"></td>').join('')}${footExtra()}</tr>`;
  });

  html += '</tfoot>';

  document.getElementById('shiftTable').innerHTML = html;
  renderBiko();
}

function openPopup(e, staff, dayObj, targetEl) {
  popupTarget = { staff, dayObj };
  const { y, m, d } = dayObj;
  const dow     = dayOfWeek(y, m, d);
  const holName = HOLIDAYS[dateStr(y, m, d)] || '';
  const current = getShift(staff, dayObj);
  const shiftSkls = getShiftSkills(staff);
  const wsSkls    = getWorkSkills(staff);

  document.getElementById('popupTitle').textContent =
    `${m}月${d}日（${DOW_JA[dow]}）${holName ? '★' + holName + '　' : ''}${staff}`;

  // Info row: shift skills + work skills
  const infoEl = document.getElementById('popupInfoRow');
  let infoHtml = '';
  if (shiftSkls.length > 0) {
    infoHtml += `<span>シフト: ${shiftSkls.map(c => { const s = SHIFT_MAP[c]; return `<span style="background:${s?.bg};color:${s?.fg};padding:0 4px;border-radius:2px;font-weight:bold;">${esc(c)}</span>`; }).join(' ')}</span>`;
  }
  if (wsSkls.length > 0) {
    infoHtml += `<span>作業: ${wsSkls.map(ws => { const st = WS_STYLE[ws]; return `<span style="background:${st.bg};color:${st.fg};padding:0 4px;border-radius:2px;font-weight:bold;">${esc(ws)}</span>`; }).join(' ')}</span>`;
  }
  infoEl.innerHTML = infoHtml;

  const grid = document.getElementById('popupGrid');
  grid.innerHTML =
    SHIFTS.map(s => {
      const noSkill = s.code !== '休' && s.code !== '有給' && shiftSkls.length > 0 && !shiftSkls.includes(s.code);
      const btnLabel = s.code === '誕' ? '🎂' : esc(s.code);
      const btnTime  = s.time !== '-' ? `<small>${esc(s.time)}</small>` : '';
      return `<button class="popup-shift-btn${noSkill ? ' no-skill' : ''}"
        data-code="${esc(s.code)}"
        style="background:${s.bg};color:${s.fg};${current === s.code ? 'outline:2px solid rgba(0,0,0,0.5);' : ''}"
        title="${esc(s.label)} ${esc(s.time)}${noSkill ? ' ※スキル外' : ''}">
        ${btnLabel}${btnTime}
      </button>`;
    }).join('') +
    `<button class="popup-clear-btn" data-code="">空白（クリア）</button>` +
    `<button class="popup-cancel-btn" id="popupCancelBtn">キャンセル</button>`;

  const popup = document.getElementById('shiftPopup');
  popup.style.display = 'block';
  const rect = targetEl.getBoundingClientRect();
  let left = rect.left, top = rect.bottom + 6;
  const pw = popup.offsetWidth, ph = popup.offsetHeight;
  if (left + pw > window.innerWidth  - 8) left = window.innerWidth  - pw - 8;
  if (top  + ph > window.innerHeight - 8) top  = rect.top - ph - 6;
  if (left < 8) left = 8; if (top < 8) top = 8;
  popup.style.left = left + 'px'; popup.style.top = top + 'px';

  document.getElementById('popupCancelBtn').addEventListener('click', closePopup);
}

// 前半または後半のテーブル HTML を生成（独立した <table> として）
function buildHalfTableHTML(half) {
  const allDays = getPeriodDays();
  const subDays = allDays.filter(d => half === 'first' ? d.d <= 15 : d.d > 15);
  if (!subDays.length) return '';

  const pk = periodKey();
  const mdata = shiftData[pk] || {};

  // 月ヘッダー用スパン計算
  const spanData = [];
  let prevM = null, spanStart = 0;
  subDays.forEach((day, i) => {
    if (day.m !== prevM) {
      if (prevM !== null) spanData.push({ y: subDays[spanStart].y, m: prevM, count: i - spanStart });
      spanStart = i; prevM = day.m;
    }
    if (i === subDays.length - 1) {
      spanData.push({ y: day.y, m: day.m, count: subDays.length - spanStart });
    }
  });

  const lastDay = subDays[subDays.length - 1].d;
  const halfLabel = half === 'first' ? `前半（1〜15日）` : `後半（16〜${lastDay}日）`;

  let html = `<div class="half-block-title">${esc(getPeriodLabel())}　${halfLabel}</div>`;
  html += `<table class="half-tbl"><thead>`;

  // 月名行
  html += `<tr><th class="hn col-name"></th>`;
  spanData.forEach(s => { html += `<th class="hn" colspan="${s.count}">${s.y}年${s.m}月</th>`; });
  html += `</tr>`;

  // 日付行
  html += `<tr><th class="hn col-name"></th>`;
  subDays.forEach(day => {
    const dc = dayClass(day.y, day.m, day.d);
    html += `<th class="hn ${dc}">${day.d}</th>`;
  });
  html += `</tr>`;

  // 曜日行
  html += `<tr><th class="hn col-name"></th>`;
  subDays.forEach(day => {
    const dc = dayClass(day.y, day.m, day.d);
    const dow = dayOfWeek(day.y, day.m, day.d);
    html += `<th class="hn ${dc}">${DOW_JA[dow]}</th>`;
  });
  html += `</tr></thead><tbody>`;

  // スタッフ行
  staffList.forEach(name => {
    const sdata = mdata[name] || {};
    html += `<tr><td class="col-name">${esc(name)}</td>`;
    subDays.forEach(day => {
      const dk = dateStr(day.y, day.m, day.d);
      const dc = dayClass(day.y, day.m, day.d);
      const code = sdata[dk] || '';
      const s = SHIFT_MAP[code];
      const style = s ? `background:${s.bg};color:${s.fg};font-weight:bold;` : '';
      const dcCls = s ? '' : dc;
      const restCls = code === '休' ? ' shift-rest' : '';
      const content = (!code || code === '休') ? '' : esc(code);
      html += `<td class="${dcCls}${restCls}" style="${style}">${content}</td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  return html;
}

/* =====================================================
   PAID LEAVE MANAGEMENT
===================================================== */
/** 年度（4月〜翌3月）の全期間キーを返す。fy = 年度開始年 */
function getFiscalPeriodKeys(fy) {
  const keys = [];
  for (let m = 4; m <= 12; m++) keys.push(`${fy}-${pad2(m)}-16`);
  for (let m = 1; m <= 3;  m++) keys.push(`${fy + 1}-${pad2(m)}-16`);
  return keys;
}

/** currentYear/Month から現在の年度を推定 */
function currentFiscalYear() {
  return currentMonth >= 4 ? currentYear : currentYear - 1;
}

/** 年度 fy のスタッフ有給付与日数 */
function getPaidLeaveGranted(name, fy) {
  return paidLeaveData[name]?.[String(fy)]?.granted ?? 0;
}

/** 年度 fy のスタッフ有給取得日数（shiftData から集計） */
function getPaidLeaveUsed(name, fy) {
  let count = 0;
  getFiscalPeriodKeys(fy).forEach(pk => {
    const nd = shiftData[pk]?.[name] || {};
    Object.values(nd).forEach(code => { if (code === '有給') count++; });
  });
  return count;
}

/** 年度 fy のスタッフ年間出勤日数（有給・休・誕 以外） */
function getAnnualWorkCount(name, fy) {
  let count = 0;
  getFiscalPeriodKeys(fy).forEach(pk => {
    const nd = shiftData[pk]?.[name] || {};
    Object.values(nd).forEach(code => {
      if (code && code !== '休' && code !== '誕' && code !== '有給') count++;
    });
  });
  return count;
}

/** 年度 fy のスタッフ年間休日数（休 + 誕 + 有給 の合計） */
function getAnnualHolidayCount(name, fy) {
  let count = 0;
  getFiscalPeriodKeys(fy).forEach(pk => {
    const nd = shiftData[pk]?.[name] || {};
    Object.values(nd).forEach(code => {
      if (code === '休' || code === '誕' || code === '有給') count++;
    });
  });
  return count;
}

function renderPlTable(fy) {
  /* --- サマリーカード --- */
  const sumEl = document.getElementById('plSummary');
  const totalGranted = staffList.reduce((s, n) => s + getPaidLeaveGranted(n, fy), 0);
  const totalUsed    = staffList.reduce((s, n) => s + getPaidLeaveUsed(n, fy), 0);
  sumEl.innerHTML =
    `<div class="pl-summary-card"><div class="pl-sc-label">${fy}年度 有給付与合計</div><div class="pl-sc-val">${totalGranted}日</div></div>` +
    `<div class="pl-summary-card"><div class="pl-sc-label">${fy}年度 有給取得合計</div><div class="pl-sc-val pl-used">${totalUsed}日</div></div>` +
    `<div class="pl-summary-card"><div class="pl-sc-label">${fy}年度 有給残合計</div><div class="pl-sc-val">${totalGranted - totalUsed}日</div></div>`;

  /* --- テーブル --- */
  let html = `<thead><tr>
    <th>氏名</th>
    <th>付与日数<br><small style="font-weight:normal;">(編集可)</small></th>
    <th>取得済日数</th>
    <th>残日数</th>
    <th>年間出勤日数</th>
    <th>年間休日数<br><small style="font-weight:normal;">(休+誕+有給)</small></th>
  </tr></thead><tbody>`;

  staffList.forEach((name, i) => {
    const granted  = getPaidLeaveGranted(name, fy);
    const used     = getPaidLeaveUsed(name, fy);
    const remain   = granted - used;
    const workDays = getAnnualWorkCount(name, fy);
    const holDays  = getAnnualHolidayCount(name, fy);
    const remCls   = remain < 0 ? 'over' : 'ok';
    const rowBg    = i % 2 === 0 ? '' : ' style="background:#fafbfd;"';
    html += `<tr${rowBg}>
      <td>${esc(name)}</td>
      <td><input class="pl-input" type="number" min="0" max="99" step="1"
          data-pl-name="${esc(name)}" data-pl-fy="${fy}" value="${granted}"> 日</td>
      <td class="pl-used">${used} 日</td>
      <td class="pl-remain ${remCls}">${remain} 日</td>
      <td>${workDays > 0 ? workDays + ' 日' : '—'}</td>
      <td class="pl-holiday-count">${holDays > 0 ? holDays + ' 日' : '—'}</td>
    </tr>`;
  });

  /* 合計行 */
  const gWork = staffList.reduce((s, n) => s + getAnnualWorkCount(n, fy), 0);
  const gHol  = staffList.reduce((s, n) => s + getAnnualHolidayCount(n, fy), 0);
  html += `</tbody><tfoot class="pl-tfoot"><tr>
    <td>合計</td>
    <td>${totalGranted} 日</td>
    <td>${totalUsed} 日</td>
    <td>${totalGranted - totalUsed} 日</td>
    <td>${gWork > 0 ? gWork + ' 日' : '—'}</td>
    <td>${gHol > 0 ? gHol + ' 日' : '—'}</td>
  </tr></tfoot>`;

  document.getElementById('plTable').innerHTML = html;
}

function savePaidLeave() {
  document.querySelectorAll('.pl-input').forEach(inp => {
    const name = inp.dataset.plName;
    const fy   = inp.dataset.plFy;
    const n    = Math.max(0, parseInt(inp.value, 10) || 0);
    if (!paidLeaveData[name]) paidLeaveData[name] = {};
    if (!paidLeaveData[name][fy]) paidLeaveData[name][fy] = {};
    paidLeaveData[name][fy].granted = n;
  });
  saveData();
  // サマリーカードを再描画
  renderPlTable(parseInt(document.getElementById('plYearSel').value, 10));
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 12) { currentMonth = 1;  currentYear++; }
  if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
  renderTable();
}
function goToday() {
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth() + 1;
  if (now.getDate() < 16) { m--; if (m < 1) { m = 12; y--; } }
  currentYear = y; currentMonth = m;
  renderTable();
}

function runAutoCreate() {

  const optSatRest   = document.getElementById('optSatRest').checked;
  const optSunRest   = document.getElementById('optSunRest').checked;
  const optWorkSkill = document.getElementById('optWorkSkill').checked;
  const optOverwrite = document.getElementById('optOverwrite').checked;

  const pk   = periodKey();
  const days = getPeriodDays();
  if (!shiftData[pk]) shiftData[pk] = {};

  // Phase 1: assign shifts based on shift skills
  staffList.forEach(name => {
    const skills  = getShiftSkills(name);
    const workSat = getWorkSat(name);
    const workSun = getWorkSun(name);
    if (skills.length === 0) return;

    if (!shiftData[pk][name]) shiftData[pk][name] = {};

    const baseSkills = skills.filter(c => c !== '誕');
    const rotation = shuffle([...baseSkills]);
    let rotIdx = 0;

    days.forEach(day => {
      const dk  = dateStr(day.y, day.m, day.d);
      if (!optOverwrite && shiftData[pk][name][dk]) return;

      const dow = dayOfWeek(day.y, day.m, day.d);
      const sat = dow === 6;
      const sun = dow === 0;
      const hol = isHoliday(day.y, day.m, day.d);

      // 誕生日登録済み → 自動で誕生日休暇
      if (isBirthday(name, day.y, day.m, day.d)) { shiftData[pk][name][dk] = '誕'; return; }
      // 社員：会社カレンダー休業日 → 休み（ただし土曜=workSat・日曜祝日=workSunで出勤する場合は除く。
      // COMPANY_HOLIDAYSには土日が丸ごと含まれているため、シフト勤務の社員（配送等）はここで除外しないと
      // 個人設定で出勤扱いにしても常に休みへ上書きされてしまう）
      const isWeekendOverride = (sat && workSat) || ((sun || hol) && workSun);
      if (getStaffType(name) === '社員' && isCompanyHoliday(day.y, day.m, day.d) && !isWeekendOverride) { shiftData[pk][name][dk] = '休'; return; }
      if ((sun || hol) && optSunRest && !workSun) { shiftData[pk][name][dk] = '休'; return; }
      if (sat && optSatRest && !workSat)       { shiftData[pk][name][dk] = '休'; return; }
      // 定休日・希望休 → 休
      if (isRegularDayOff(name, day.y, day.m, day.d))   { shiftData[pk][name][dk] = '休'; return; }
      if (isRequestedDayOff(name, day.y, day.m, day.d)) { shiftData[pk][name][dk] = '休'; return; }

      // 日付制約（時刻フィルター）
      const validShifts = getValidShiftsForDate(name, dk, baseSkills);
      const pool = validShifts.length > 0 ? validShifts : baseSkills;
      shiftData[pk][name][dk] = pool[rotIdx % pool.length];
      rotIdx++;
      if (rotIdx > 0 && rotIdx % rotation.length === 0) shuffleInPlace(rotation);
    });

    // 連勤制限：最大連勤日数を超えたら休みを挿入
    const maxC = getMaxConsecutive(name);
    if (maxC > 0) {
      let streak = 0;
      days.forEach(day => {
        const dk  = dateStr(day.y, day.m, day.d);
        const code = shiftData[pk][name][dk] || '';
        const isWork = code && code !== '休';
        if (isWork) {
          streak++;
          if (streak > maxC) {
            // 定休日・希望休でなければ休みに変更
            if (!isRegularDayOff(name, day.y, day.m, day.d) && !isRequestedDayOff(name, day.y, day.m, day.d)) {
              shiftData[pk][name][dk] = '休';
              streak = 0;
            }
          }
        } else {
          streak = 0;
        }
      });
    }
  });

  // Phase 2: satisfy work skill requirements (if optWorkSkill)
  if (optWorkSkill) {
    days.forEach((day, dayIdx) => {
      const dk  = dateStr(day.y, day.m, day.d);
      const dow = dayOfWeek(day.y, day.m, day.d);

      WORK_SKILLS.forEach(ws => {
        const req = getWsReq(ws, dow);
        if (req === 0) return;

        // Count current coverage
        const working = staffList.filter(name => {
          const c = shiftData[pk]?.[name]?.[dk] || '';
          return c && c !== '休' && getWorkSkills(name).includes(ws);
        });

        let gap = req - working.length;
        if (gap <= 0) return;

        // Find staff with this work skill who are on 休 and have shift skills
        // 社員の会社カレンダー休業日・定休日・希望休・連勤上限は上書きしない
        const candidates = staffList.filter(name => {
          const c      = shiftData[pk]?.[name]?.[dk] || '';
          const sSkils = getShiftSkills(name);
          return c === '休' && getWorkSkills(name).includes(ws) && sSkils.length > 0
            && !(getStaffType(name) === '社員' && isCompanyHoliday(day.y, day.m, day.d))
            && !isRegularDayOff(name, day.y, day.m, day.d)
            && !isRequestedDayOff(name, day.y, day.m, day.d)
            && !wouldExceedMaxConsecutive(name, dayIdx, days, pk);
        });

        for (const cand of candidates) {
          if (gap <= 0) break;
          const sSkils = getShiftSkills(cand).filter(c => c !== '誕');
          // 日付制約（時刻フィルター）を尊重してシフトを選ぶ
          const validShifts = getValidShiftsForDate(cand, dk, sSkils);
          if (validShifts.length === 0) continue;
          shiftData[pk][cand][dk] = validShifts[0];
          gap--;
        }
      });
    });
  }

  saveData();
  renderTable();
}

function shuffle(arr) { return arr.slice().sort(() => Math.random() - 0.5); }
function shuffleInPlace(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

document.getElementById('staffListEl').addEventListener('click', e => {
  // ---- Action buttons (up / down / del / addReqOff / removeReqOff) ----
  const actionBtn = e.target.closest('[data-action]');
  if (actionBtn) {
    const action = actionBtn.dataset.action;

    if (action === 'up' || action === 'down' || action === 'del') {
      const idx = parseInt(actionBtn.dataset.idx, 10);
      if (action === 'up')   moveStaff(idx, -1);
      if (action === 'down') moveStaff(idx,  1);
      if (action === 'del')  deleteStaff(idx);
      return;
    }

    if (action === 'addReqOff') {
      const si   = parseInt(actionBtn.dataset.si, 10);
      const name = staffList[si];
      const inp  = document.getElementById(`req-date-${si}`);
      const dk   = inp?.value; // 'YYYY-MM-DD'
      if (!dk) return;
      ensureSkillObj(name);
      if (!staffSkills[name].requestedDaysOff) staffSkills[name].requestedDaysOff = [];
      if (!staffSkills[name].requestedDaysOff.includes(dk)) {
        staffSkills[name].requestedDaysOff.push(dk);
        staffSkills[name].requestedDaysOff.sort();
        saveData();
        refreshReqOffList(si, name);
        renderTable();
      }
      inp.value = '';
      return;
    }

    if (action === 'removeReqOff') {
      const si   = parseInt(actionBtn.dataset.si, 10);
      const name = staffList[si];
      const dk   = actionBtn.dataset.dk;
      ensureSkillObj(name);
      if (!staffSkills[name].requestedDaysOff) staffSkills[name].requestedDaysOff = [];
      const idx = staffSkills[name].requestedDaysOff.indexOf(dk);
      if (idx >= 0) {
        staffSkills[name].requestedDaysOff.splice(idx, 1);
        saveData();
        refreshReqOffList(si, name);
        renderTable();
      }
      return;
    }

    if (action === 'addDc') {
      const si   = parseInt(actionBtn.dataset.si, 10);
      const name = staffList[si];
      const dk   = document.getElementById(`dc-date-${si}`)?.value;
      const type = document.getElementById(`dc-type-${si}`)?.value;
      if (!dk) return;
      ensureSkillObj(name);
      // 同日付の既存エントリを上書き
      staffSkills[name].dateConstraints = staffSkills[name].dateConstraints.filter(c => c.dk !== dk);
      if (type === 'memo') {
        const text = document.getElementById(`dc-memo-${si}`)?.value.trim();
        if (!text) return;
        staffSkills[name].dateConstraints.push({ dk, type: 'memo', text });
      } else {
        const val = parseInt(document.getElementById(`dc-hour-${si}`)?.value, 10);
        if (isNaN(val) || val < 0 || val > 23) return;
        staffSkills[name].dateConstraints.push({ dk, type, value: val });
      }
      staffSkills[name].dateConstraints.sort((a, b) => a.dk.localeCompare(b.dk));
      saveData();
      refreshDcList(si, name);
      document.getElementById(`dc-date-${si}`).value = '';
      return;
    }

    if (action === 'removeDc') {
      const si = parseInt(actionBtn.dataset.si, 10);
      const ci = parseInt(actionBtn.dataset.ci, 10);
      const name = staffList[si];
      ensureSkillObj(name);
      staffSkills[name].dateConstraints.splice(ci, 1);
      saveData();
      refreshDcList(si, name);
      return;
    }

    return;
  }

  // ---- Skill panel toggle ----
  const toggle = e.target.closest('.si-skill-toggle');
  if (toggle) {
    const panel = document.getElementById(`skill-panel-${toggle.dataset.si}`);
    if (panel) panel.classList.toggle('open');
    return;
  }

  // ---- Shift / WS skill chip ----
  const chip = e.target.closest('.skill-chip');
  if (chip) {
    const si   = parseInt(chip.dataset.si, 10);
    const name = staffList[si];
    const type = chip.dataset.type;
    const code = chip.dataset.code;
    ensureSkillObj(name);

    if (type === 'shift') {
      const arr = staffSkills[name].shifts;
      const idx = arr.indexOf(code);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(code);
      chip.classList.toggle('active', staffSkills[name].shifts.includes(code));
    } else if (type === 'ws') {
      if (!staffSkills[name].workSkills) staffSkills[name].workSkills = [];
      const arr = staffSkills[name].workSkills;
      const idx = arr.indexOf(code);
      if (idx >= 0) arr.splice(idx, 1); else arr.push(code);
      chip.classList.toggle('active', staffSkills[name].workSkills.includes(code));
    }
    saveData();
    return;
  }

  // ---- 定休日 DOW chip ----
  const dowChip = e.target.closest('.dow-chip');
  if (dowChip) {
    const si   = parseInt(dowChip.dataset.si, 10);
    const name = staffList[si];
    const dow  = parseInt(dowChip.dataset.dow, 10);
    ensureSkillObj(name);
    if (!staffSkills[name].regularDaysOff) staffSkills[name].regularDaysOff = [];
    const arr = staffSkills[name].regularDaysOff;
    const idx = arr.indexOf(dow);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(dow);
    dowChip.classList.toggle('active', staffSkills[name].regularDaysOff.includes(dow));
    saveData();
    renderTable();
  }
});

function ensureSkillObj(name) {
  if (!staffSkills[name]) {
    staffSkills[name] = { type: 'パート', shifts: [], workSat: false, workSun: false, workSkills: [], regularDaysOff: [], requestedDaysOff: [], hourlyWage: 0, maxConsecutive: 0, dateConstraints: [], birthMonth: 0, birthDay: 0 };
  }
  if (staffSkills[name].maxConsecutive === undefined) staffSkills[name].maxConsecutive = 0;
  if (!staffSkills[name].dateConstraints) staffSkills[name].dateConstraints = [];
  if (staffSkills[name].birthMonth === undefined) staffSkills[name].birthMonth = 0;
  if (staffSkills[name].birthDay === undefined) staffSkills[name].birthDay = 0;
  if (staffSkills[name].workSun === undefined) staffSkills[name].workSun = false;
}

function getMaxConsecutive(name)   { return staffSkills[name]?.maxConsecutive ?? 0; }
function getDateConstraints(name)  { return staffSkills[name]?.dateConstraints ?? []; }

/** "HH:MM" 形式を時間数(float)に変換 */
function parseHourStr(s) {
  if (!s) return null;
  const [h, m] = s.split(':').map(Number);
  return h + (m || 0) / 60;
}

/** シフトコードの開始・終了時刻を返す {start, end} (null if '-') */
function getShiftHours(code) {
  const s = SHIFT_MAP[code];
  if (!s || s.time === '-') return null;
  const [startStr, endStr] = s.time.split('～');
  return { start: parseHourStr(startStr), end: parseHourStr(endStr) };
}

/** 日付制約を考慮して使用可能なシフトコード一覧を返す */
function getValidShiftsForDate(name, dk, skills) {
  const dc = getDateConstraints(name).find(c => c.dk === dk);
  if (!dc || dc.type === 'memo') return skills;
  return skills.filter(code => {
    const h = getShiftHours(code);
    if (!h) return true;
    if (dc.type === 'endBy'    && h.end   > dc.value) return false;
    if (dc.type === 'startFrom' && h.start < dc.value) return false;
    return true;
  });
}

/** dayIdx日にnameを出勤扱いにした場合、連勤上限（maxConsecutive）を超えるかどうかを判定
    （直前の連続勤務日数をshiftDataから遡って数える。Phase2は日付の昇順で処理するため後方チェックは不要） */
function wouldExceedMaxConsecutive(name, dayIdx, days, pk) {
  const maxC = getMaxConsecutive(name);
  if (maxC <= 0) return false;
  let streak = 1;
  for (let i = dayIdx - 1; i >= 0; i--) {
    const dk2  = dateStr(days[i].y, days[i].m, days[i].d);
    const code = shiftData[pk]?.[name]?.[dk2] || '';
    if (code && code !== '休') streak++; else break;
  }
  return streak > maxC;
}

function buildDcTags(name, i) {
  const list = getDateConstraints(name);
  if (!list.length) return '<span style="font-size:11px;color:#aaa;">未設定</span>';
  return list.map((dc, ci) => {
    const [,m2,d2] = dc.dk.split('-').map(Number);
    let label, cls;
    if (dc.type === 'endBy')     { label = `${m2}/${d2} ${dc.value}時まで`;  cls = 'type-end'; }
    else if (dc.type === 'startFrom') { label = `${m2}/${d2} ${dc.value}時から`; cls = 'type-start'; }
    else                         { label = `${m2}/${d2} ${dc.text}`;          cls = ''; }
    return `<span class="dc-tag ${cls}">${label}<button class="dc-remove" data-action="removeDc" data-si="${i}" data-ci="${ci}" title="削除">×</button></span>`;
  }).join('');
}

function refreshDcList(si, name) {
  const el = document.getElementById(`dc-list-${si}`);
  if (el) el.innerHTML = buildDcTags(name, si);
}

/** 希望休タグリストだけを再描画（スタッフ一覧全体を再描画せず） */
function refreshReqOffList(si, name) {
  const el = document.getElementById(`req-list-${si}`);
  if (!el) return;
  const reqOff = getRequestedDaysOff(name).slice().sort();
  if (reqOff.length === 0) {
    el.innerHTML = '<span style="font-size:11px;color:#aaa;">未設定</span>';
    return;
  }
  el.innerHTML = reqOff.map(dk => {
    const [,m2,d2] = dk.split('-').map(Number);
    return `<span class="req-off-tag">
      ${m2}/${d2}
      <button class="req-off-remove" data-action="removeReqOff" data-si="${si}" data-dk="${esc(dk)}" title="削除">×</button>
    </span>`;
  }).join('');
}

document.getElementById('staffListEl').addEventListener('change', e => {
  if (e.target.dataset.type === 'sat') {
    const si   = parseInt(e.target.dataset.si, 10);
    const name = staffList[si];
    ensureSkillObj(name);
    staffSkills[name].workSat = e.target.checked;
    saveData();
  }
  if (e.target.dataset.type === 'sun') {
    const si   = parseInt(e.target.dataset.si, 10);
    const name = staffList[si];
    ensureSkillObj(name);
    staffSkills[name].workSun = e.target.checked;
    saveData();
  }
  if (e.target.dataset.type === 'stafftype') {
    const si   = parseInt(e.target.dataset.si, 10);
    const name = staffList[si];
    ensureSkillObj(name);
    staffSkills[name].type = e.target.value;
    saveData();
    renderTable();
    renderStaffList();
  }
  if (e.target.dataset.type === 'wage') {
    const si   = parseInt(e.target.dataset.si, 10);
    const name = staffList[si];
    ensureSkillObj(name);
    staffSkills[name].hourlyWage = parseInt(e.target.value, 10) || 0;
    saveData();
  }
  if (e.target.dataset.type === 'consec') {
    const si   = parseInt(e.target.dataset.si, 10);
    const name = staffList[si];
    ensureSkillObj(name);
    staffSkills[name].maxConsecutive = parseInt(e.target.value, 10) || 0;
    saveData();
  }
  if (e.target.dataset.type === 'birthMonth') {
    const si   = parseInt(e.target.dataset.si, 10);
    const name = staffList[si];
    ensureSkillObj(name);
    staffSkills[name].birthMonth = parseInt(e.target.value, 10) || 0;
    saveData();
  }
  if (e.target.dataset.type === 'birthDay') {
    const si   = parseInt(e.target.dataset.si, 10);
    const name = staffList[si];
    ensureSkillObj(name);
    staffSkills[name].birthDay = parseInt(e.target.value, 10) || 0;
    saveData();
  }
  // 制約種別セレクトの切り替え: 時刻 ↔ メモ 入力欄を切り替え
  if (e.target.classList.contains('dc-type-sel')) {
    const si = parseInt(e.target.id.replace('dc-type-', ''), 10);
    const isMemo = e.target.value === 'memo';
    const hourWrap = document.getElementById(`dc-hour-wrap-${si}`);
    const memoInp  = document.getElementById(`dc-memo-${si}`);
    if (hourWrap) hourWrap.style.display = isMemo ? 'none' : '';
    if (memoInp)  memoInp.style.display  = isMemo ? '' : 'none';
  }
});

function addStaff() {
  const input    = document.getElementById('newStaffInput');
  const typeEl   = document.getElementById('newStaffType');
  const name     = input.value.trim();
  const staffType = typeEl ? typeEl.value : 'パート';
  if (!name) { input.focus(); return; }
  if (staffList.includes(name)) { alert(`「${name}」は既に登録されています`); input.select(); return; }
  staffList.push(name);
  ensureSkillObj(name);
  staffSkills[name].type = staffType;
  saveData();
  input.value = '';
  input.focus();
  renderStaffList();
}

function deleteStaff(idx) {
  const name = staffList[idx];
  if (!confirm(`「${name}」を削除しますか？\nシフト・スキルデータも削除されます。`)) return;
  staffList.splice(idx, 1);
  delete staffSkills[name];
  delete paidLeaveData[name];
  Object.keys(shiftData).forEach(pk => { delete shiftData[pk][name]; });
  saveData();
  renderStaffList();
}

function moveStaff(idx, dir) {
  const ni = idx + dir;
  if (ni < 0 || ni >= staffList.length) return;
  [staffList[idx], staffList[ni]] = [staffList[ni], staffList[idx]];
  saveData();
  renderStaffList();
}

/* =====================================================
   AUTH
===================================================== */
function onAuthChange(session) {
  currentUser = session?.user ?? null;
  const editorActions  = document.getElementById('editor-actions');
  const loginBtn       = document.getElementById('loginBtn');
  const logoutBtn      = document.getElementById('logoutBtn');
  const loginUserLabel = document.getElementById('loginUserLabel');
  const bikoTextarea   = document.getElementById('bikoText');

  if (currentUser) {
    document.body.setAttribute('data-editor', '');
    if (editorActions)  editorActions.style.display  = 'flex';
    if (loginBtn)       loginBtn.style.display        = 'none';
    if (logoutBtn)      logoutBtn.style.display        = '';
    if (loginUserLabel) { loginUserLabel.style.display = ''; loginUserLabel.textContent = currentUser.email; loginUserLabel.title = currentUser.email; }
    if (bikoTextarea)   bikoTextarea.readOnly          = false;
  } else {
    document.body.removeAttribute('data-editor');
    if (editorActions)  editorActions.style.display  = 'none';
    if (loginBtn)       loginBtn.style.display        = '';
    if (logoutBtn)      logoutBtn.style.display        = 'none';
    if (loginUserLabel) { loginUserLabel.style.display = 'none'; loginUserLabel.textContent = ''; }
    if (bikoTextarea)   bikoTextarea.readOnly          = true;
  }
}

document.getElementById('loginBtn').addEventListener('click', () => {
  if (!_supabase) { alert('Supabase が設定されていません。'); return; }
  document.getElementById('loginEmail').value         = '';
  document.getElementById('loginPassword').value      = '';
  document.getElementById('loginError').style.display = 'none';
  openModal('loginOverlay');
  setTimeout(() => document.getElementById('loginEmail').focus(), 60);
});

document.getElementById('loginCancelBtn').addEventListener('click', () => closeModal('loginOverlay'));
document.getElementById('loginOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('loginOverlay')) closeModal('loginOverlay');
});
document.getElementById('loginSubmitBtn').addEventListener('click', doLogin);
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  if (!_supabase) return;
  const email     = document.getElementById('loginEmail').value.trim();
  const password  = document.getElementById('loginPassword').value;
  const errEl     = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmitBtn');

  if (!email || !password) {
    errEl.textContent      = 'メールアドレスとパスワードを入力してください。';
    errEl.style.display    = '';
    return;
  }

  submitBtn.disabled    = true;
  submitBtn.textContent = 'ログイン中…';
  errEl.style.display   = 'none';

  try {
    const { error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    closeModal('loginOverlay');
  } catch {
    errEl.textContent   = 'ログインに失敗しました。メールアドレスとパスワードを確認してください。';
    errEl.style.display = '';
  } finally {
    submitBtn.disabled    = false;
    submitBtn.textContent = 'ログイン';
  }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (!_supabase) return;
  await _supabase.auth.signOut();
});

/* =====================================================
   INIT
===================================================== */
function updateStickyOffsets() {
  const hh = document.getElementById('app-header').offsetHeight;
  const lh = document.getElementById('legend').offsetHeight;
  document.documentElement.style.setProperty('--header-h', hh + 'px');
  document.documentElement.style.setProperty('--legend-h', lh + 'px');
}

(function init() {
  loadData();
  goToday();
  renderLegend();
  updateStickyOffsets();
  new ResizeObserver(updateStickyOffsets).observe(document.getElementById('app-header'));
  new ResizeObserver(updateStickyOffsets).observe(document.getElementById('legend'));
  if (_supabase) {
    document.getElementById('syncBtn').style.display = 'inline-flex';
    document.getElementById('syncBtn').addEventListener('click', () => loadDataFromSupabase());
    // Auth: ページ再読み込み時のセッション復元 + 状態変化の監視
    _supabase.auth.getSession().then(({ data: { session } }) => onAuthChange(session));
    _supabase.auth.onAuthStateChange((_event, session) => onAuthChange(session));
    // 起動時にSupabaseから最新データを自動取得（他のPCと同期）
    loadDataFromSupabase();
  } else {
    // Supabase未設定時はローカルモードとして全編集を許可
    onAuthChange({ user: { email: 'local' } });
  }
})();
</script>
